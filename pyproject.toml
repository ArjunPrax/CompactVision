[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "compact-vision"
version = "0.1.0"
description = "Reproducible compact CPU vision inference and stage-latency evaluation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "torch>=2.6,<3",
  "torchvision>=0.21,<1",
  "onnx>=1.17,<2",
  "onnxruntime>=1.20,<2",
  "numpy>=2,<3",
  "pillow>=11,<13",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
]

[project.scripts]
compact-vision = "compact_vision.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["compact_vision", "benchmarks"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
